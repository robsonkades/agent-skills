      is contended, or when -XX:+UseCompactObjectHeaders is weighed for its effect on field adjacency. Not the
      introductory cache treatment or NUMA (cpu-cache-and-numa), contention on a lock (lock-inflation), thread pinning
      (numa-and-cpu-affinity), or sizing objects in bytes and what compact headers do and do not save
