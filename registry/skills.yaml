  - name: hot-partitions-and-rebalancing
    description: "Repairing a partitioned system whose distribution has failed in production: balanced key placement does
      not imply balanced traffic, so one celebrity key or one large tenant saturates a shard while the map is correct.
      Covers detection — per-shard rate, latency and storage, and the max-to-mean ratio, because an aggregate dashboard
      hides skew; naming the key by top-K sampling; the read-hot, write-hot, storage-hot and overloaded-fleet
      signatures; the repairs and their prices; and the rebalance, with its double-ownership window and versioned map.
      Use when one shard runs far above the others while the fleet average looks fine, when a shard is hot before and
      after a rehash, when one tenant dominates a shard, or when a rebalance is planned or is itself the incident. Not
      the mapping function (consistent-hashing), the key choice (sharding-and-partitioning), caching
