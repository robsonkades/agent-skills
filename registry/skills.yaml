      cancellation, context and admission semantics. Use when a continuation runs on an I/O thread, a branch failure
      disappears, allOf or anyOf has the wrong policy, a timeout leaves work running, or asynchronous fan-out overloads
      a dependency. Distinguishes Java 17/21 APIs from Java 25 preview structured-concurrency alternatives.
