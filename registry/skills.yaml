      when a plugin mechanism is proposed for a variation that has one implementation, or when a mapper has started
      making decisions. Does not cover data-access specifics (data-source-patterns), the aggregate boundary abstraction
      (repository-pattern), overall layering (layering-and-boundaries), or detecting overuse in general
