      is the other one, batching questions into rounds instead of interrogating, and marking the few that are genuinely
      blocking. Use when a feature request is ambiguous and the choice is between asking and assuming, when a long list
      of questions is about to be sent at once, when work is stalled on a question that has no consequence, when
      implementation is about to start on a guessed answer, or when a question is being asked that a grep would have
