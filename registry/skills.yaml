  - name: gof-adapter
    description: "Adapter in modern Java: making an existing type usable through an interface it was not written for, and
      keeping a foreign model, vocabulary and failure mode from leaking inward. Covers object versus class adapters, why
      a lambda already adapts a single-method interface, the error-translation duty most adapters omit, when an adapter
      has quietly become a translator with business rules in it, and when a passthrough should be deleted. Use when
