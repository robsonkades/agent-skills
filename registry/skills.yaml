  - name: zgc-generational-internals
    description: "Generational ZGC internals: coloured pointers without multi-mapping, the load and store barriers, the
      young and old cycles and their three STW phases, the remembered-set bitmap and its double buffering, relocation
      and page management, allocation stalls, and the generational log and JFR event names. Use when a deploy script
