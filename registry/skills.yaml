  - name: connection-pool-sizing
    description: "Sizing and diagnosing a JDBC connection pool: L = λ × W where W is connection hold time rather than query
      latency, the database-side ceiling, HikariCP timeouts and lifetimes, transaction boundaries and
      idle-in-transaction, N+1 detection, JDBC batching, and what virtual threads change. Use when choosing
      maximumPoolSize, when connection-timeout is 0 or 30 s, when threads wait for connections under load, when HTTP or
      queue calls happen inside @Transactional, when connections die silently behind a firewall or load balancer, when
      hibernate.jdbc.batch_size appears not to work, or when raising the pool is proposed as the fix. Does not cover the
      general queueing arithmetic (littles-law-and-queueing), thread pool sizing (thread-sizing-and-virtual-threads), or
      caching to reduce load (caching-strategies)."
