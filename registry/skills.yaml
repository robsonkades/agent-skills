        path: skills/gof-proxy
        integrity: sha256-BsqKNdHkcnha5bvxearEDxzpwD04GbKEmEkxggy4W1M=
  - name: gof-singleton
    description: "Singleton in modern Java, treated as a high-risk pattern: it conflates \"one instance\" with \"reachable
      from anywhere\", which must be justified separately. Covers why dependency injection gives uniqueness as a
      consequence of wiring, the scale ladder showing a Java singleton is unique per class loader and never per cluster,
      the safe lazy-initialisation idioms and the class-initialisation deadlock they invite, the static-state leakage
      that makes tests order-dependent, and the distributed mechanisms that give system-wide singularity. Use when
      getInstance() appears, when a scheduled job must run once across replicas, when someone says \"singleton\" meaning
      Spring's singleton scope, when tests pass alone and fail together, or when a cache or registry is being made
      global. Does not cover shared immutable instances for memory (gof-flyweight), wiring in general
      (java-dependency-inversion), cluster-wide leadership (leader-election), or once-only scheduling across replicas
      (distributed-locks-and-leases)."
    keywords:
      - design-patterns
      - gof
      - creational
      - singleton
      - global-state
      - concurrency
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-singleton
        integrity: sha256-5qDiz5UYsuhFm00NyvvE0m0IASIpJ/nK8NIWmaWLaGE=
  - name: gof-state
    description: "State in modern Java: making an object's behaviour depend on an explicit state, with the transitions
      themselves modelled rather than implied by scattered flags. Covers the intent difference from Strategy, where
      transitions should live — in the state classes, in a table, or in one exhaustive switch — sealed records against
      enums, rejecting illegal transitions by default, persisting a state through stable codes rather than ordinals,
      atomic transitions under concurrency, and timeouts as transitions in a durable workflow. Use when boolean flags
      multiply on an entity, when a status field is checked in scattered ifs, when an illegal transition reaches
      production, when a workflow must survive a restart, or when two requests transition the same entity concurrently.
      Does not cover interchangeable algorithms (gof-strategy), saga orchestration across services
      (distributed-transactions-and-sagas, gof-mediator), or optimistic locking mechanics
      (offline-concurrency-control)."
    keywords:
      - design-patterns
      - gof
      - behavioral
      - state
      - state-machine
      - transitions
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-state
        integrity: sha256-uyi0CYb8mjH/OOE+m1lN4qHCOiI+gpcJofG+j70EQQY=
  - name: gof-strategy
    description: "Strategy in modern Java, separated into three things that are usually conflated: the design concept (an
      algorithm varies), the classical class hierarchy, and the lambda or functional interface that expresses it today.
      Covers when a function value is enough and when a named type earns its keep, selecting a strategy by key instead
      of an if-else chain, the trap of strategies that differ only in constants and may be configuration, how shared
      state changes concurrency obligations, and the contract test implementations can share. Use when an algorithm must
      vary at runtime, when a switch over a type code keeps growing, when a class hierarchy exists whose members are
      one-line methods, or when strategy classes differ only in a rate or a threshold. Does not cover lifecycle-governed
      legal operations and transitions (gof-state), two independently varying hierarchies (gof-bridge), an algorithm
      skeleton with varying steps (gof-template-method), or choosing which object to create (gof-factory-method)."
    keywords:
      - design-patterns
      - gof
      - behavioral
      - strategy
      - lambda
      - selection
