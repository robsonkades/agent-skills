  - name: feature-scope-analysis
    description: "Fixing what a feature includes and, more usefully, what it deliberately excludes: sorting every candidate
      item into required, recommended, optional, out of scope or future work, tracing each included item back to a
      requirement or a constraint, and catching the additions that arrived because they seemed like a good idea. Use
