  - name: enterprise-transactions
    description: "Transaction boundaries as an architectural decision: where a transaction starts and ends, what isolation
      level actually buys, how propagation and rollback rules behave in practice, the costs of spanning a network call
      or a user's thinking time, and how to handle effects outside its atomic scope. Use when a use case writes twice
      and nobody can say whether it is atomic, when @Transactional sits on a repository or a controller, when a
      transaction stays open across an HTTP call or a message publish, when a rollback did not happen because the
      exception was checked or the call was self-invoked, when isolation is being raised to fix a race, when a read-only
      flag is added without knowing what it does, when a long-running batch holds locks, or when a transaction is
      expected to cover two services. Does not cover locks held across user think time (offline-concurrency-control),
      what a client may observe across replicas (consistency-models), repeat-safety of an operation (idempotency), or
      database-specific lock behaviour."
