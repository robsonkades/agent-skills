        integrity: sha256-1MyltWr0lLTn0WAC90jDJAQnEPE045fNs8+Bx8FITag=
  - name: gof-patterns-and-distribution
    description: What happens to a Gang-of-Four pattern when the collaboration crosses a process boundary, and which
      additional architectural contracts it may require. Covers process-local, boundary, interaction and algorithm
      patterns; assumptions that need rechecking at a boundary — shared state, clocks, atomicity, ordering and delivery;
      the transformations (Singleton to leader election, Observer to pub/sub, Iterator to pagination, Mediator to an
      orchestrator); and the level confusion that treats a design pattern as a substitute for an architectural one. Use
      when a local design is being distributed, when a pattern name is applied to a network component, when a
      "singleton" or a cache is expected to hold across replicas, or when a getter turns out to make a call. Does not
      cover the individual patterns (the gof-\* skills), saga and outbox mechanics (distributed-transactions-and-sagas,
      event-driven-architecture), service boundary decisions (distribution-boundaries), or failure taxonomy
      (failure-models).
    keywords:
      - design-patterns
      - gof
      - distributed-systems
      - boundaries
      - architecture
      - messaging
