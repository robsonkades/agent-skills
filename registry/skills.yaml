  - name: engineering-communication
    description: "Communicating engineering facts to people who will act on them: stating what is true, what follows from
      it, what is still uncertain, and the options and recommendation when needed. Covers raising a risk early, saying
      no to a request in a way that leaves a yes on the table, resolving technical disagreement by making the checkable
      claim checkable, escalating without going around someone, and status updates during an incident. Use when bad news
      has to travel, when a risk is visible but unspoken, when you are being asked to commit to something you believe is
      not achievable, when a technical argument has gone two rounds without new information, when a message hedges every
      claim it makes, or when non-engineers need to make a decision that depends on a technical fact. Does not cover the
      numbers in an estimate (estimation-under-uncertainty), clarifying a requirement (requirements-and-acceptance),
      review comments specifically (code-review), or deciding to take on debt (technical-debt-decisions)."
