  - name: cache-sharding-and-replication
    description: "Topology for a cache that no longer fits one node: client-side sharded, proxy-fronted, clustered, and
      fully replicated, compared on failure behaviour, cost and client complexity; and why a read after a write on a
      replicated cache is not read-your-writes. Owns the arithmetic nobody does before an incident: removing one of N
      nodes remaps about 1/N of keys and every one of those misses hits the origin at once — mitigated by replication,
      warming, coalescing and admission control. Use when choosing between client sharding, a proxy and cluster mode,
      when a cache node loss or rolling restart took the database with it, when replicas of a cache disagree, or when
      deciding between sharding the cache and replicating all of it. Does not cover whether to cache, TTL, stampede or
      invalidation (caching-strategies), the key-to-node mapping (consistent-hashing), a single hot cache key
      (hot-partitions-and-rebalancing), entry serialisation cost (serialization-performance), or what a replicated read
      observes (consistency-models)."
    keywords:
