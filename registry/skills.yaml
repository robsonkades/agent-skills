  - name: consensus-and-quorums
    description: "Crash-fault consensus and quorum reasoning: FLP, safety versus liveness, majority 2f+1, R + W > N
      intersection and its limits, voter/failure-domain placement, Raft terms and why external fencing still requires
      resource enforcement, plus the differing read/watch contracts of etcd, ZooKeeper and Consul. Use when a cluster
      size is being chosen, when nodes are spread across AZs or regions, when application data or a queue is being put
      in etcd or ZooKeeper, when a coordination store sits on the request path, when a watch is treated as a delivery
      guarantee, or when a fourth node is proposed for redundancy. Does not cover CAP and the model ladder
      (consistency-models), mutual exclusion built on top (distributed-locks-and-leases), electing a singleton worker
      (leader-election), or the fault model itself (failure-models)."
