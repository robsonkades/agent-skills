  - name: concurrency-limiting-and-bulkheads
    description: "Bounding in-flight work with semaphores and bulkheads: the difference between a concurrency limit, a rate
      limit and a queue limit, why Little's Law is the only thing connecting them, placing one limit per scarce
      resource, partitioning so one caller or dependency cannot consume the whole budget, and why a Semaphore bounds one
