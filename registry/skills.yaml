      tool. Use when resilience configuration exists but has never been exercised, when a timeout or retry budget is
      being chosen, when an incident was caused by a dependency being slow rather than down, when a consumer is assumed
      idempotent, when a rollout is protected by a probe nobody has failed on purpose, or when chaos engineering is
      proposed without a hypothesis. Does not cover the in-process test pyramid and architecture rules
      (architecture-testing), thread-level race testing (concurrency-testing), throughput and saturation measurement
      (load-testing), or the remedies themselves (retries-and-backoff, circuit-breakers, timeouts-and-deadlines)."
