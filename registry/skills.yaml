  - name: gof-flyweight
    description: "Flyweight in modern Java: sharing one immutable instance across many logical occurrences to bound memory,
      and why the modern JVM makes that pay only for long-lived duplicates. Covers the intrinsic/extrinsic split, why
      allocation of short-lived objects is nearly free so pooling them loses, the memory arithmetic deciding whether a
