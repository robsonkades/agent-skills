  - name: enterprise-architecture-smells
    description: "Detecting structural problems in an enterprise application from evidence, and telling genuine harm apart
      from unfamiliar-but-fine: anaemic domain models, god services, transaction-script sprawl, generic repositories,
      excessive layering and DTO mapping, leaky abstractions, distributed monoliths, persistence leakage, and
      abstractions that only move complexity. Use when reviewing an architecture or a large pull request, when adding a
      field touches seven files, when a \"clean architecture\" refactor is being proposed, when an interface has one
      implementation, when a wrapper adds no behaviour, when a pattern is being applied because it is a pattern, when a
      codebase feels wrong but nobody can say why, or when deciding whether an abstraction is worth keeping. Does not
