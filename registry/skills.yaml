        integrity: sha256-w6C5T4QDkXa75bhVCBOMGP34SpEL4t4FZWyq4ArZIcM=
  - name: gof-mediator
    description: "Mediator in modern Java, treated as high-risk: replacing many-to-many collaboration with a hub that owns
      the interaction protocol, and the god object that hub becomes when nothing bounds it. Covers the direction test
      that separates it from a facade, event-based alternatives and their delivery coupling, the reentrancy loop when a
      colleague notifies the hub that notifies it back, when the hub serializes work, and orchestration versus
      choreography with the availability coupling an orchestrator introduces. Use when collaborators reference each
      other in a web, when a coordinator class keeps growing, when a command bus is called a mediator, when a saga
      orchestrator is designed, or when a notification loops between two components. Does not cover one-way notification
      to unknown subscribers (gof-observer, event-driven-architecture), a simplifying entry point (gof-facade), request
      dispatch to one handler (gof-command), or saga mechanics (distributed-transactions-and-sagas)."
    keywords:
      - design-patterns
      - gof
      - behavioral
      - mediator
      - orchestration
      - coordination
    latest: 1.2.2
