  - name: enterprise-application-architecture
    description: "The entry point for reasoning about an enterprise application's architecture: what makes these systems
      distinctive (data that outlives the code, concurrent users, integration, rules that change), the forces that shape
      every decision, how the kind of application changes the answers, and which specific skill answers which question.
      Use when starting on an unfamiliar enterprise codebase, when designing a new application or module and the first
      structural decisions are open, when someone asks \"how should this system be structured\", when a design review
      has no shared vocabulary, when a decision needs to be located (\"is this a persistence question or a domain
