    description: Engineer process-local concurrency limits and bulkheads around scarce resources, with explicit admission
      deadlines, permit ownership, weighted work, partitioning, fairness, observability and overload validation.
      Distinguishes concurrency, rate and queue limits and the assumptions behind Little's Law. Use after virtual-thread
      migrations, during downstream saturation, or when local limits leak, over-release, double-queue or fail to compose
      across replicas.
