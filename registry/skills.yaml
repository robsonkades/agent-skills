  - name: gof-decorator
    description: "Decorator in modern Java: wrapping an object in something of its own interface to add behaviour,
      stackably, at runtime — and the fact that the stacking order changes the semantics. Covers the ordering of retry,
      timeout, circuit breaker, cache, metrics and logging and what each arrangement means, retry amplification across
