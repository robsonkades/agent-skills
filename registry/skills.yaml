  - name: distributed-locks-and-leases
    description: "Mutual exclusion across processes, and why the naive version does not: a lock with a TTL is a lease, and a
      lease alone does not exclude — the holder can stall past expiry and keep writing while a second holder is
      admitted, with no error anywhere. Covers the fencing token as the only correct fix and the resource's duty to
      enforce it, Redis locking with an owner token, Redlock's contested status, database row and advisory locks, and
      the alternatives that beat a lock. Use when SET NX appears with a TTL, when a lock is released with a bare DEL,
      when watchdog renewal is treated as safety, when two workers processed one record with no exception, or when a
      lock is proposed to make a non-idempotent write safe. Not how a lock service is built (consensus-and-quorums), one
      long-lived owner of a role (leader-election), surviving duplicates instead (idempotency), in-process locking
      (java-memory-model), one-database boundaries (enterprise-transactions), or locks across user think time
      (offline-concurrency-control)."
    keywords:
      - distributed-systems
      - locking
      - lease
      - fencing
      - redis
      - redlock
      - concurrency
