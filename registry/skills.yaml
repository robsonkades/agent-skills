  - name: feature-solution-analysis
    description: "Producing the option set for a feature-level choice and the block that recommends one: always considering
      the simplest feasible approach, comparing complete options for the same boundary, evaluating the axes this feature
      is actually sensitive to, and saying what would have to be true for a rejected option to win. Use when a feature
      has a real choice in it — a mechanism, a storage strategy, a place to put the work — when one approach has already
