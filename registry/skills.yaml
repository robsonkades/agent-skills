  - name: virtual-threads-internals
    description: "Virtual thread internals: the continuation freeze algorithm, mount and unmount and StackChunk copying,
      forced deoptimisation of non-freezable frames, the dedicated ForkJoinPool scheduler and its automatic
      compensation, what jdk.VirtualThreadPinned actually measures, the heap cost of suspended stacks per collector, and
      the residual pinning cases on the current baseline. Use when pinning is suspected, when -Djdk.tracePinnedThreads
      appears in a runbook, when ForkJoinPool worker threads grow past the configured parallelism, when a JNI or FFM
      call sits on the hot path, when someone proposes replacing synchronized with ReentrantLock to stop pinning, when
      virtual threads run CPU-bound work, or when GC marking time rose after adopting them. Does not cover the
      introductory adoption and sizing treatment (thread-sizing-and-virtual-threads), happens-before and correctness
      (java-memory-model), or work-stealing pool mechanics in general (forkjoinpool-and-work-stealing)."
