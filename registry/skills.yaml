  - name: java-api-design
    description: "Naming and API design for Java code that others call: names carrying domain vocabulary, method and boolean
      naming conventions, arity and parameter objects, overload hazards, discoverability, public versus internal surface
      (package-private, JPMS exports), and API evolution — binary, source and behavioural compatibility, deprecation,
      semantic versioning. Use when designing or reviewing a public type, adding a method, overload or record component
      to a published API, or deciding what a module exports. Does not cover builder mechanics (java-fluent-apis) or
      exception contracts (java-exception-design)."
