  - name: distributed-failure-catalogue
    description: "A recognition index of named distributed failure patterns, each given as symptom, mechanism, where it
      hides in code or config, and the skill that owns the fix: thundering herd, retry storm, cascading failure, timeout
      stacking, unbounded queue growth, resource exhaustion, gray failure, duplicate processing, split-brain, clock
      skew, version skew in a rolling deploy, stale work past its deadline, destructive cleanup, input explosion, the
      optional dependency that is really required, the second-system rewrite, expected errors mixed with unexpected, and
      the absence of errors as an error. Use when an incident has a shape you recognise but cannot name, when a
      postmortem needs the pattern's name, when a design review needs failures to argue against, when a consumer stopped
      silently and no alert fired, or when a cleanup job deleted more than intended. Does not contain the fixes: every
      entry routes to its owner — cascading-failures, retries-and-backoff, circuit-breakers, failure-models and the
      rest."
