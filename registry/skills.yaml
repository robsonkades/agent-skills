  - name: allocation-profiling
    description: "Finding which code allocates and how many bytes: TLAB fast path and slow path, JFR
      jdk.ObjectAllocationSample versus the legacy TLAB events, async-profiler alloc mode, deriving allocation rate from
      the GC log, and validating a fix by reprofiling. Use when GC overhead is above 10-15% of CPU, when collector
      tuning has stopped moving the number, when a p99 spike is being blamed on TLAB refill, when a JFR recording of
      jdk.ObjectAllocationInNewTLAB came back empty, when someone proposes pooling small objects or -XX:+TraceTLAB, or
