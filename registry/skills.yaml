  - name: feature-risk-analysis
    description: "Naming what could go wrong with a specific feature in a form that can be acted on: the failure stated as
      an event rather than a worry, how anyone would find out it happened, what reduces its probability or its cost, and
      what is done if it happens anyway. Use before implementation on anything touching data, integrations, concurrency
      or a released contract, when a plan has a risk section containing only adjectives, when a HIGH risk has no
      detection signal, when a migration or a breaking change is about to ship, or when a review asks what happens if
      this fails and there is no answer. Does not catalogue distributed failure modes in general
      (distributed-failure-catalogue, failure-models), does not decide whether a deliberate shortcut is acceptable
      (technical-debt-decisions), and does not design the resilience mechanism (timeouts-and-deadlines,
