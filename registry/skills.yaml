  - name: zgc-and-shenandoah
    description: "Operating ZGC and Shenandoah in production: concurrent relocation via coloured pointers and load barriers,
      the CPU the concurrent phases actually take, allocation stalls, and which flags still exist. Use when a service
      migrated to a concurrent collector and throughput dropped, when a GC log shows \"Allocation Stall\", when a pod of
      1-2 CPUs runs ZGC or Shenandoah, when a config still carries -XX:+ZGenerational or G1 flags after the migration,
      when a ZGC-versus-Shenandoah comparison does not declare ShenandoahGCMode, or when RSS from ps/top is being used
