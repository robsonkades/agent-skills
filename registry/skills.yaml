  - name: idempotency
    description: "Making an operation safe to apply more than once: natural idempotency versus an idempotency key plus a
      dedup store; choosing and scoping the key, and why a broker message id is the weakest source; the concurrent
      in-flight duplicate that a check-then-act read cannot handle; replaying the stored response instead of returning a
      conflict; and why idempotent is not commutative. Use when a retry produces a second row, charge or email, when a
      handler starts with an exists() check before a write, when an Idempotency-Key header is being added or ignored,
      when two identical requests arrive concurrently, or when a dedup table has no TTL. Does not cover why duplicates
      arrive (delivery-semantics), compensating actions (distributed-transactions-and-sagas), what the dedup store's own
      consistency must be (consistency-models), or caching (caching-strategies)."
