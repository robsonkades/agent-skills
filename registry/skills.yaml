        path: skills/gof-mediator
        integrity: sha256-sY+Oan3zjvwngOS3hzTF5RfvEDrvSFin7AtOhpuXk1k=
  - name: gof-memento
    description: "Memento in modern Java: capturing an object's state so it can be restored later, without exposing that
      state to whoever holds the capture. Covers the encapsulation techniques Java offers, why immutable state can be
      retained by reference behind an appropriate boundary, the memory cost of an undo stack and the alternatives
      (inverses, diffs, structural sharing), the torn capture when the source mutates mid-copy, and the distinction from
      a durable snapshot and from event sourcing. Use when undo, drafts, what-if branches or checkpoints are being
      designed, when a getState/setState pair is proposed on a domain object, when an undo stack grows without bound, or
      when someone calls a persisted snapshot a memento. Does not cover the operations being undone (gof-command),
      copying an object for reuse (gof-prototype), event-sourced aggregates and projections (event-sourcing), or
      distributed checkpoint barriers (distributed-aggregation-and-barriers)."
    keywords:
      - design-patterns
      - gof
      - behavioral
      - memento
      - undo
      - snapshot
