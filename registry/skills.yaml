  - name: enterprise-base-patterns
    description: The small structural patterns that hold an enterprise application together — Gateway, Mapper, Layer
      Supertype, Separated Interface, Registry, Special Case, Plugin and Service Stub — with the judgement about when
      each earns its place and when it is indirection. Use when an external system's API is being called directly from
      business code, when the same null check appears in twenty callers, when a base class is accumulating unrelated
      protected helpers, when a Registry or a static holder is being used to reach a collaborator, when an interface is
