  - name: gof-pattern-antipatterns
    description: "Detecting and removing design-pattern misuse: abstractions that trace to no requirement, patterns chosen
      because a name sounded right, and the specific failure each overused pattern produces. Covers the detectable
      signals — an interface with one implementation, a class per constant, a factory whose products are unrelated, a
      hub with twelve dependencies, a listener never deregistered, a wrapper stack nobody can read, a getInstance() a
      test must reset — with the cause, the concrete cost, and the removal procedure that does not break callers. Use
      when reviewing a design that feels over-engineered, when a class name ends in Manager or Helper and nobody can say
      what it does, when tests need many mocks to construct one object, or when deleting an abstraction and the change
      must stay safe. Does not cover choosing a pattern (gof-pattern-selection), telling lookalikes apart
      (gof-pattern-confusion), general code smells (java-code-smells), or enterprise architecture smells
      (enterprise-architecture-smells)."
    keywords:
