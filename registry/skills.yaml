  - name: concurrency-diagnostics
    description: Evidence-led diagnosis of deadlock, starvation, livelock, saturation, leaks and virtual-thread scheduler
      problems. Compares traditional platform-thread dumps, jcmd all-thread dumps, ThreadMXBean,
      VirtualThreadSchedulerMXBean, JFR, wall/CPU profiles and application telemetry, including each tool's visibility
      and consistency limits. Use when progress stops, CPU and latency disagree, tasks disappear, shutdown hangs, or a
      virtual-thread dump is inconclusive.
