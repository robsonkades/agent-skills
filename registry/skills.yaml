  - name: blocking-and-nonblocking-io
    description: "Four things routinely conflated into one: a blocking API, a blocked OS thread, non-blocking I/O at the
      syscall, and an asynchronous programming model. Covers which JDK operations unmount a virtual thread and which
      capture the carrier, the difference between capture-with-compensation and pinning, the socket poller behind
      blocking socket calls, file I/O as the case Loom does not fix, and what blocking an event loop costs. Use when
      someone says virtual threads make I/O non-blocking, when a file-heavy workload on virtual threads grows the
      carrier pool, when a blocking call sits inside a Netty or Reactor pipeline, when
      jdk.virtualThreadScheduler.maxPoolSize is raised to fix a symptom, or when an argument turns on whether the model
      or the syscall is the bottleneck. Not choosing between the two models (reactive-and-virtual-thread-selection),
      continuation mechanics and pinning diagnosis (virtual-threads-internals), demand signalling
      (reactive-backpressure), or copy avoidance (io-uring-and-zero-copy)."
    keywords:
