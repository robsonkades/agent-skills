  - name: gof-observer
    description: "Observer in modern Java, treated as high-risk: notifying an unknown set of dependents that something
      changed, and the guarantees it does not provide. Covers the properties people assume and the contract does not
      give — synchrony on the publisher thread, unspecified ordering, one exception breaking the rest, no delivery
      guarantee — the listener leak from a long-lived subject, reentrant registration during notification, never
      notifying while holding a lock, and the differences between an in-process observer, a reactive stream, and
      distributed pub/sub. Use when a listener mechanism is added, when a listener leak appears, when an in-process
      listener is moved to a message broker, when order between listeners matters, or when a failing listener silently
      loses work. Does not cover Spring's event phases and the outbox (event-driven-architecture), broker delivery
      semantics (delivery-semantics), reactive backpressure (reactive-backpressure), or hub-based coordination
      (gof-mediator)."
    keywords:
