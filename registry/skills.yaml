  - name: consistency-models
    description: "Choosing distributed consistency guarantees as an engineering decision: linearizability, sequential/causal
      ordering, session guarantees (read-your-writes, monotonic reads), bounded staleness and eventual convergence,
      stated as observable contracts rather than a false total ladder; CAP stated correctly—the choice between C and A
      exists only while partitioned—and PACELC, replica paths and transaction isolation boundaries. Use when a user
      cannot see their own write, when a read after a write returns the previous value, when a design names a model
      instead of an observable requirement, when reads are being routed to replicas, or when someone cites \"pick two\".
      Does not cover multi-service atomicity (distributed-transactions-and-sagas), quorum arithmetic
      (consensus-and-quorums), caches (caching-strategies), replicated cache topology (cache-sharding-and-replication),
      or the JMM's happens-before (java-memory-model)."
