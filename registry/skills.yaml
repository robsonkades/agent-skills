        integrity: sha256-KCXy68YH+pDzmH9smcEx96Fb+gL/GIoL3kX9nItq7Qs=
  - name: gof-pattern-thinking
    description: "Reasoning from a design problem to a design, where a Gang-of-Four pattern is one possible outcome and \"no
      pattern\" is an equally valid one: naming the forces, identifying what varies and along how many axes, walking the
      alternatives ladder from language feature up to architecture, and pricing the indirection before adopting it. Use
      gof-pattern-selection to shortlist unresolved choices once the forces are understood. Use when a pattern name is
      proposed before the problem is stated, when a review must judge whether an abstraction earns its place, when
      factories and strategies have accumulated that trace to no requirement, when an indirection needs pricing, or when
      a design is starting and the vocabulary is about to be chosen by habit. Does not cover the individual patterns
      (the gof-* skills), telling lookalike patterns apart (gof-pattern-confusion), the misuse catalogue
      (gof-pattern-antipatterns), enterprise/PoEAA patterns (pattern-selection-and-composition), or SOLID as a framing
      (java-solid)."
    keywords:
