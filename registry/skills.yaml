        path: skills/gof-composite
        integrity: sha256-CIlwRtA+6YRBXd2WJtqNGkak3p2jWju40eb6yUrdWjk=
  - name: gof-decorator
    description: "Decorator in modern Java: wrapping an object in something of its own interface to add behaviour,
      stackably, at runtime — and the fact that the stacking order changes the semantics. Covers the ordering of retry,
      timeout, circuit breaker, cache, metrics and logging and what each arrangement means, retry amplification across
      layers, the identity loss that breaks ==, instanceof and listener deregistration, when a framework interceptor is
      the same pattern already provided, and the thread-safety a stateful decorator introduces. Use when resilience or
      observability layers are added around a client, when a wrapper chain is reordered, when a decorated object fails
      an instanceof check, when retries appear at two levels, or when a wrapper is proposed that changes the interface.
      Does not cover changing an interface (gof-adapter), controlling access to an object (gof-proxy), one entry point
      over a subsystem (gof-facade), or the individual protection policies (circuit-breakers, retries-and-backoff,
      timeouts-and-deadlines)."
    keywords:
      - design-patterns
      - gof
      - structural
      - decorator
      - resilience
      - ordering
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-decorator
        integrity: sha256-1jA9rCGpdK64JRfAp+bAXwslY0PRfS11Uvlzrs4wjlo=
  - name: gof-facade
    description: "Facade in modern Java: one coherent entry point over a subsystem of collaborators, so callers depend on an
      intention rather than on a sequence. Covers the difference between a facade (simplifies, does not forbid) and a
      boundary (forbids), the god-facade drift where one class accumulates unrelated use cases, how application services
      and gateways can play this role while retaining their own boundary responsibilities, and the transaction and
      fan-out decisions a facade method silently owns. Use when callers repeat the same orchestration sequence, when a
      legacy subsystem needs fencing, when unrelated responsibilities accumulate in a service, or when a facade method
      fans out to remote services. Does not cover changing one type's interface (gof-adapter), adding behaviour to one
      object (gof-decorator), hub-based coordination between peers (gof-mediator), the coarse-grained remote boundary
      and its DTOs (remote-facade-and-dto), or transaction-boundary mechanics (enterprise-transactions)."
    keywords:
      - design-patterns
      - gof
      - structural
      - facade
      - application-service
      - boundaries
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-facade
        integrity: sha256-pIuZGRrqZof8T/p1Cgt1zoJVLiraz7deHjEM9L9dpz8=
  - name: gof-factory-method
    description: "Factory Method in modern Java, and the three different things that share its name: the GoF pattern (a
      creation hook a subclass overrides inside an inherited algorithm), Effective Java's static factory method (a named
      constructor, not this pattern), and any method someone called createX. Covers when the subclass hook is genuinely
      right, when an injected Supplier or a keyed map is a simpler alternative, and the
      constructor-calls-an-overridable-method trap it invites. Use when a protected createX() hook is proposed, when a
      class is subclassed only to change which type it instantiates, when tests subclass production code to substitute
      an object, when a static factory is being called Factory Method in review, or when deciding between a subclass
      hook and a Supplier. Does not cover families of related products (gof-abstract-factory), the surrounding algorithm
      skeleton (gof-template-method), or static factory naming conventions (java-object-construction)."
    keywords:
      - design-patterns
      - gof
      - creational
      - factory-method
      - supplier
      - java
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-factory-method
        integrity: sha256-Ai2lQkpkmohRuHr+0SAIQg7DXk4AYd6qU0DkK5bNtFo=
  - name: gof-flyweight
    description: "Flyweight in modern Java: sharing one immutable instance across many logical occurrences to reduce
      retained memory, with benefits dependent on duplicate lifetimes and lookup cost. Covers the intrinsic/extrinsic
      split, why cheap TLAB allocation does not make reclamation free, the memory arithmetic deciding whether a cache
      entry costs more than the object it saves, string deduplication and boundary canonicalisation as candidate
      alternatives, the unbounded intern map as a leak, and the == trap. Use when object pooling or interning is
      proposed, when a heap dump shows millions of duplicate values, when someone suggests caching small objects for
      speed, when a shared instance is mutable, or when a flyweight cache is described as a distributed cache. Does not
      cover application-level caching policy (caching-strategies), finding the duplicates (heap-dump-analysis),
      allocation cost in general (allocation-profiling), or one-instance-with-global-access (gof-singleton)."
    keywords:
      - design-patterns
      - gof
      - structural
      - flyweight
      - memory
      - interning
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-flyweight
        integrity: sha256-haFsKONRLOm0t1z+O8mSh+Z3s3+JMB27SyUP6b0jUeE=
  - name: gof-interpreter
    description: "Interpreter in modern Java: representing a small language as a typed tree and evaluating it, using
      per-node interpretation or a sealed AST with an exhaustive switch according to the extension contract. Covers
      parsing as a separate problem the pattern does not solve, when an existing expression language beats writing one,
      how general expression engines become code-execution surfaces when exposed with unsafe capabilities, the resource
      bounds an interpreter over untrusted input needs, and closure compilation when tree walking is too slow. Use when
      a filter, rule or formula language is designed, when configuration has grown conditionals, when someone proposes
      embedding an expression evaluator, or when an expression from a request is passed to a template or EL engine. Does
      not cover adding operations over an existing tree (gof-visitor), the tree structure itself (gof-composite), query
      specifications over a database (query-objects-and-specifications), or JIT compilation of Java (jit-compilation)."
    keywords:
      - design-patterns
      - gof
      - behavioral
      - interpreter
      - dsl
      - ast
    latest: 1.2.2
    versions:
      - version: 1.2.2
        path: skills/gof-interpreter
        integrity: sha256-MlYFHqjTYB3k3Hq57vrlB3Ft+tp81cFR1MA6aQTYrp0=
  - name: gof-iterator
    description: "Iterator in modern Java: traversing an aggregate without exposing it, and choosing between Iterator,
      Stream and Spliterator — external pull versus internal lazy pipeline versus the parallel decomposition primitive.
      Covers when a Spliterator can adapt to both, what fail-fast really promises and how weakly consistent iterators
      differ, streams that hold a resource and must be closed, remote pagination as iteration with page drift, and the
      characteristics that decide whether a stream can be sized or split. Use when exposing a collection from a type,
      when a custom traversal is being written, when ConcurrentModificationException appears, when a stream over a file
      or a result set leaks, when paging through a remote API, or when a parallel stream is not faster. Does not cover
      stream pipeline design and collectors in general (java-streams), the tree being traversed (gof-composite), adding
      operations over it (gof-visitor), or database paging strategy."
    keywords:
      - design-patterns
      - gof
      - behavioral
      - iterator
      - stream
      - spliterator
