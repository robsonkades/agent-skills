  - name: gof-template-method
    description: "Template Method in modern Java: fixing an algorithm's skeleton while named steps vary, and the inheritance
      coupling that makes composition the better default. Covers why the template method must be final and the hook
      surface minimal, the constructor-calls-an-overridable-method trap, protected hooks becoming an API you cannot
