  - name: feature-readiness-review
    description: "The intake, pre-implementation, and completion gates for a feature: first validating the
      Product/Engineering or Tech Feature baseline, then checking that nothing implementation depends on is still
      unresolved, and after, checking that what was built is what was agreed and that the claim of completion is
      supported. Use before the first line of a planned feature is written, when implementation is about to start with
      an open blocking question, when a feature is about to be declared done, when \"done\" is being claimed on a green
      build, when a feature shipped and the decisions were never written down, or when a reviewer cannot tell which
