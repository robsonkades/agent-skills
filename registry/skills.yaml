  - name: timeouts-and-deadlines
    description: "Bounding how long a call may take and propagating that bound: per-hop timeouts versus an absolute
      deadline, deadline propagation over HTTP and gRPC, remaining-budget arithmetic and refusing work that cannot
      finish, cooperative cancellation of abandoned callee work, and keeping connect, read, total and retry timeouts
      consistent. Use when a client sets a connect timeout but no request timeout, when Future.get() or join() is called
      with no bound, when a timeout is a round number repeated across services, when three hops each wait five seconds,
      when a retry policy total exceeds the caller timeout, when a JDBC call has no setQueryTimeout, when a Kafka
      consumer rebalances during slow processing, or when a timed-out request leaves work running downstream. Does not
      cover retry-policy design (retries-and-backoff), percentiles (latency-statistics), tail decomposition
      (tail-latency-analysis), tripping on repeated timeouts (circuit-breakers), or pool sizing
      (connection-pool-sizing)."
