  - name: distributed-systems
    description: "Triage and routing entry point for distributed systems in Java: turn a design question or a production
      symptom into the one skill that owns it. Use when work crosses a process boundary and the next step is unclear — a
      new service or integration is being designed, a review must decide whether an operation is safe to retry or
      duplicate, a request fans out or a queue backs up, replicas disagree, an incident is spreading across services, or
      someone proposes sharding, a distributed lock, a leader or an event-driven rewrite. Routes to failure-models for
      the fault model, delivery-semantics and idempotency for duplicates, consistency-models for what a reader observes,
      and the rest of the family for each specific decision. Does not itself cover any of those topics; JVM performance
      is java-performance and in-process concurrency is the Java concurrency family."
