name: Bug report
description: Something does not work as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security** issue, please do not file it here —
        see [SECURITY.md](https://github.com/robsonkades/agent-skills/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact commands, starting from a clean state if possible.
      placeholder: |
        1. agent-skills install java-performance --agent codex
        2. ...
      render: shell
    validations:
      required: true

  - type: input
    id: error-code
    attributes:
      label: Error code
      description: The ASK_* code from the output, if there was one.
      placeholder: ASK_INTEGRITY_MISMATCH

  - type: textarea
    id: doctor
    attributes:
      label: Output of `agent-skills doctor`
      description: Redact anything sensitive. This tells us more than a version number alone.
      render: text
    validations:
      required: true

  - type: textarea
    id: verbose
    attributes:
      label: Output with `--verbose`
      description: Re-run the failing command with `--verbose` and paste the output.
      render: text

  - type: input
    id: version
    attributes:
      label: CLI version
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
