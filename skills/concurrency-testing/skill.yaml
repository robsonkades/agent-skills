schemaVersion: 1

name: concurrency-testing
version: 1.1.0
description: >-
  Testing concurrent Java so failures appear in CI rather than in an incident: what a passing
  concurrency test does and does not prove, replacing sleeps with latches and deterministic
  executors, explicitly exercising cancellation, interruption and timeout, stress tests that
  assert invariants, and soak tests that catch permit and connection leaks. Use when a test uses
  Thread.sleep to wait for another thread, when a concurrency test is flaky and a retry is
  proposed, when cancellation or timeout paths have no test at all, when tests assert on thread
  names or pool sizes and broke after a virtual-thread change, when a race was found in
  production and nobody can reproduce it, or when a concurrency limit or fallback has never been
  exercised under failure. Does not cover proving memory-model claims (java-memory-model,
  varhandles-and-memory-ordering), benchmark methodology (jmh-microbenchmarks), load generation
  and rates (load-testing), or diagnosing a live system (concurrency-diagnostics).

