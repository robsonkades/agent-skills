    version: ^1.0.0

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Queueing Models
      short_description: Picking and reading M/M/c, M/D/1 and Kingman
      default_prompt: Use Queueing Models to choose the queueing model this system actually satisfies and read it correctly.
