schemaVersion: 1

name: java-design-by-contract
version: 1.0.0
description: >-
  Contracts as the semantics of a Java API: preconditions, postconditions and
  invariants mapped to Java 25 mechanisms — constructor validation, invariants as
  types, postconditions via tests and assert, Javadoc contracts, behavioural
  subtyping, and contracts across sealed hierarchies. Use when invariants live in
  callers' heads, when an override adds a requirement, or when assert guards public
  input. Does not cover boundary validation practice (java-defensive-programming) or
  LSP in its five-principle context (java-solid).

