schemaVersion: 1

name: java-exception-design
version: 1.0.0
description: >-
  Exceptions as API design in Java: checked versus unchecked as a deliberate decision,
  hierarchy sizing, translation at layer boundaries with cause preservation, retryable
  versus non-retryable as an explicit property, and when a sealed result type beats an
  exception. Use when designing an exception surface, when causes are being lost or
  failures swallowed, or when retry logic parses exception messages. Does not cover
  boundary input validation (java-defensive-programming) or contract semantics
  (java-design-by-contract).

