  url: https://github.com/robsonkades/agent-skills
  directory: skills/online-database-schema-migrations

keywords:
  - database
  - schema-migration
  - online-ddl
  - backfill
  - rollback
  - expand-contract

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies: []

suggests:
  - architecture-refactoring-paths
  - database-bulk-loading
  - database-engine-selection-and-migration
  - database-index-design
  - mysql-innodb-performance
  - postgresql-performance
  - schema-evolution-and-compatibility
  - sql-server-performance

capabilities:
  - reads-source

agentOverrides:
