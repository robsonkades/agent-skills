schemaVersion: 1

name: java-ddd-testing
version: 1.2.0
description: >-
  Write and review Java DDD domain unit tests following the ddd-example domain
  reference: real aggregates and values, validation handlers, typed IDs, exceptions,
  utilities and local domain events. Use when adding a domain behavior test, checking
  validation timing or reviewing assertions that may miss a domain defect. Requires
  no mocks and @DisplayName on every unit test. Does not implement application,
  persistence, Spring or message-delivery tests.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/java-ddd-testing
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/java-ddd-testing

keywords:
  - java
  - ddd
  - domain-driven-design
  - aggregate
  - value-object
  - domain-events
  - validation
  - junit
  - testing
  - clean-architecture

files:
  - SKILL.md
  - skill.yaml
  - references/
  - assets/

suggests:
  - java-ddd
  - java-ddd-aggregates
  - java-ddd-value-objects
  - java-ddd-use-cases
  - java-ddd-domain-services
  - java-ddd-repositories
  - java-ddd-domain-events
  - spring-boot-testing

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Java DDD Testing
      short_description: Test domain behavior with real objects and DisplayName
      default_prompt: Use Java DDD Testing to write or review domain unit tests following the ddd-example reference, without mocks and with DisplayName.
