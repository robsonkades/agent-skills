    version: ^1.0.0

suggests:
  - compilation-and-inlining-logs
  - deoptimization
  - g1-internals
  - jfr-and-async-profiler
  - jmh-advanced
  - lock-inflation
  - object-layout-and-footprint
  - safepoints
  - simd-and-vector-api
  - zgc-generational-internals

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Reading JIT Assembly
      short_description: hsdis, PrintAssembly and perfasm output
      default_prompt: Use Reading JIT Assembly to confirm from the emitted code what the JIT actually did.
