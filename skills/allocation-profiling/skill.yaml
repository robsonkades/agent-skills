schemaVersion: 1

name: allocation-profiling
version: 2.1.3
description: >-
  Attribute Java heap allocation to code and validate reductions in bytes per operation.
  Use when allocation or GC frequency regresses, JFR allocation events are empty or disagree
  with counters, large buffers trigger G1 humongous collections or ZGC stalls, or pooling,
  TLAB tuning, or assumed JIT elimination is proposed without measurements. Covers sampling
  semantics and allocation-specific triage; general capture selection belongs to
  jfr-and-async-profiler, retention diagnosis to heap-dump-analysis, and scalar replacement
  mechanisms to jit-inlining-and-escape-analysis.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/allocation-profiling
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/allocation-profiling

keywords:
  - java
  - jvm
  - allocation
  - tlab
  - profiling
  - jfr
  - async-profiler

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: jfr-and-async-profiler
    version: ^1.0.0

suggests:
  - gc-log-analysis
  - g1-internals
  - heap-dump-analysis
  - java-reference-types-and-leaks
  - jit-inlining-and-escape-analysis
  - jmh-microbenchmarks
  - object-layout-and-footprint
  - off-heap-memory
  - pause-attribution
  - zgc-and-shenandoah

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Allocation Profiling
      short_description: Attributing allocated bytes to source lines
      default_prompt: Use Allocation Profiling to find which code is producing the allocation pressure.
