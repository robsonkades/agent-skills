schemaVersion: 1

name: java-cohesion-coupling
version: 1.0.0
description: >-
  Cohesion and coupling in Java at class, package and module level: cohesion and
  coupling types in real code, afferent/efferent coupling and instability, package
  dependency graphs, and JPMS module boundaries as enforced coupling limits. Use
  when a small change fans out across packages, when a package cycle appears, or
  when reviewing package architecture. Inverting a specific dependency edge lives
  in java-dependency-inversion.

