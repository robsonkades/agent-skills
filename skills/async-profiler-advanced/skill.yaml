schemaVersion: 1

name: async-profiler-advanced
version: 1.3.0
description: >-
  Operating async-profiler as an evidence instrument: choosing CPU, ctimer, itimer,
  wall-clock, allocation, lock, native-memory, trace, and PMU events; proving attach and
  perf-event access; bounding sampling and instrumentation bias; preserving virtual-thread,
  native, kernel, and time context; and validating conversions and differentials. Use when
  profiles are empty, idle-heavy, truncated, permission-blocked, containerized, multi-event,
  or sensitive to async-profiler/JDK version. Does not own initial profiler selection
  (jfr-and-async-profiler), visual interpretation (flame-graph-analysis), or JDK Flight
  Recorder configuration (jfr-advanced).

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/async-profiler-advanced
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/async-profiler-advanced

keywords:
  - async-profiler
  - asprof
  - jfrconv
  - profiling
  - perf-events
  - ctimer
  - flame-graph

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: allocation-profiling
    version: ^2.0.0
  - name: jfr-and-async-profiler
    version: ^1.0.0
  - name: flame-graph-analysis
    version: ^1.0.0

suggests:
  - concurrency-diagnostics
  - off-heap-memory
  - ebpf-for-jvm
  - continuous-profiling

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Async-Profiler Advanced
      short_description: Sampling engines, jfrconv and broken stacks
      default_prompt: Use Async-Profiler Advanced to pick the sampling engine this environment can actually run.
