authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/gc-log-analysis
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/gc-log-analysis

keywords:
  - java
  - jvm
  - gc
  - gc-log
  - xlog
  - safepoint
  - diagnosis

files:
