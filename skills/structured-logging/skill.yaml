schemaVersion: 1

name: structured-logging
version: 1.4.0
description: >-
  Designing application logs as governed event schemas: choosing events and fields,
  correlation and context lifecycle, exception and severity semantics, synchronous versus
  buffered delivery, overload/drop behavior, injection prevention, data minimization,
  integrity/retention and measurable cost. Use when logs require regex parsing,
  correlation is missing or stale across async work, events disappear under load, fields
  drift between services, failures are duplicated, secrets or untrusted text reach logs,
  or logging appears in latency profiles. Metric labels belong to
  metrics-and-cardinality; span topology to distributed-tracing-design; JVM -Xlog to
  unified-logging.

