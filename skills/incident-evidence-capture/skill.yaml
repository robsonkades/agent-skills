schemaVersion: 1

name: incident-evidence-capture
version: 1.3.0
description: >-
  Preserving decision-grade JVM incident evidence before remediation destroys it: setting an
  explicit recovery/evidence budget, selecting representative and control instances, copying
  existing telemetry first, capturing repeated low-risk state, escalating to JFR, heap, or core
  evidence only by symptom and approval, surviving containers/restarts, and recording integrity,
  clocks, provenance, privacy, and capture failures. Use during live degradation, impending
  restart/OOM, an unresponsive JVM, or runbook design. Owns ordering and safety;
  artifact-specific analysis belongs to heap-dump-analysis, concurrency-diagnostics,
  jfr-and-async-profiler, gc-log-analysis, and jhsdb-and-core-dumps.

license: Apache-2.0

authors:
  - name: agent-skills contributors

repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/incident-evidence-capture

keywords:
