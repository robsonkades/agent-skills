spring.application.name=spring-web-contract-fixture
server.address=127.0.0.1
server.port=0
server.servlet.context-path=/api
springdoc.api-docs.version=OPENAPI_3_1
# This fixture documents its MVC error policy explicitly, including global response components.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.deep-linking=true
# Illustrative limits for this small JSON contract, not universal production defaults.
spring.jackson.factory.constraints.read.max-nesting-depth=16
spring.jackson.factory.constraints.read.max-string-length=4096
spring.jackson.factory.constraints.read.max-number-length=100
