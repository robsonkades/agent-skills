schemaVersion: 1

name: ebpf-for-jvm
version: 2.1.0
description: >-
  Using eBPF/bpftrace to measure kernel-visible behavior around a JVM without inventing
  attribution: selecting stable tracepoints versus kprobes/uprobes/USDT, scoping by
  process/thread/cgroup, tracking syscall/futex/scheduler/block-I/O lifecycles, managing BPF
  map loss and cardinality, resolving native and time-varying JIT code, and correlating—not
  summing—kernel, JFR, profile, and application evidence. Use when scheduler delay, kernel I/O,
  faults, networking, or cross-process interference may explain JVM symptoms, or when a BPF
  script is empty/plausible-but-wrong. Does not own ordinary host diagnosis (linux-for-jvm),
  JVM-local profiling (jfr-and-async-profiler), or continuous profile operations
  (continuous-profiling).

