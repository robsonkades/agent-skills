schemaVersion: 1

name: java-performance
version: 1.0.0
description: >-
  Java performance engineering on the JVM: JIT compilation, garbage collection,
  allocation pressure, and profiling methodology. Use when diagnosing a latency
  regression, high CPU with normal GC, suspected GC pauses, memory growth that is
  not a leak, or slow startup and warmup. Hands off to jvm-gc-tuning once GC is
  confirmed as the cause.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/java-performance
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/java-performance

keywords:
  - java
  - jvm
  - performance
  - profiling
  - jit
  - gc

# No `compatibility` block: this skill works with any agent that reads SKILL.md.

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: jvm-gc-tuning
    version: ^1.0.0

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Java Performance
      short_description: JVM, JIT, GC and allocation diagnostics
      default_prompt: Use Java Performance to diagnose this latency or CPU problem.
