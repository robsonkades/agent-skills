schemaVersion: 1

name: java-refactoring
version: 1.0.0
description: >-
  Refactoring mechanics and the safety workflow for Java: characterisation tests, small
  reversible steps, behaviour preservation, binary/source/behavioural compatibility, and
  the technique catalogue — Extract/Inline, Move, Rename, Parameter Object with records,
  Replace Conditional with Polymorphism or sealed + exhaustive switch, Encapsulate
  Collection, Replace Inheritance with Composition. What to detect is java-code-smells.

