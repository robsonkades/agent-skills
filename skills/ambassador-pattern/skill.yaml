schemaVersion: 1

name: ambassador-pattern
version: 1.3.1
description: >-
  Choose or review a local outbound proxy when discovery or routing changes require client
  releases, a canary or shadow needs routing outside the app, or retries overlap across app,
  proxy and mesh. Define the listener, policy ownership, deadlines and failure behavior.
  Covers shard-map consumption and experiment routing, not shard algorithms
  (sharding-and-partitioning), container lifecycle (sidecar-pattern), or output normalization
  (adapter-sidecar-pattern).

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/ambassador-pattern
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/ambassador-pattern

keywords:
  - kubernetes
  - ambassador
  - proxy
  - sharding
  - canary
  - service-mesh

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: sidecar-pattern
    version: ^1.0.0

suggests:
  - connection-pool-sizing
  - consistent-hashing
  - coordinated-omission
  - latency-statistics
  - littles-law-and-queueing
  - opentelemetry-performance
  - retries-and-backoff
  - sharding-and-partitioning
  - timeouts-and-deadlines

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Ambassador Pattern
      short_description: Outbound routing moved into a sidecar proxy
      default_prompt: Use Ambassador Pattern to review how this service reaches its upstreams.
