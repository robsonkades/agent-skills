schemaVersion: 1

name: java-defensive-programming
version: 1.0.0
description: >-
  Where to defend in Java and where defence becomes noise: trust boundaries,
  preconditions with Objects.requireNonNull, fail-fast, input normalisation at the
  edge, and assert for internal invariants only. Use when adding or reviewing
  validation, when the same invariant is re-checked on every layer, or when hardening
  a public API. Does not cover contract semantics (java-design-by-contract),
  nullability contracts (java-null-safety), defensive copies (java-immutability) or
  exception design (java-exception-design).

