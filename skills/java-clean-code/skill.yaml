schemaVersion: 1

name: java-clean-code
version: 2.0.0
description: >-
  Readability and intention-revealing structure in Java: method and class sizing —
  including the point where splitting becomes harmful fragmentation — abstraction
  levels within a method, comments, hidden side effects, temporal coupling and hidden
  dependencies. Does not cover naming and API shape (java-api-design), the smell
  catalogue (java-code-smells), exception handling (java-exception-design) or null
  handling (java-null-safety).

