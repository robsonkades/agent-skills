schemaVersion: 1

name: completablefuture-composition
version: 1.2.0
description: >-
  Design and diagnose CompletionStage graphs with explicit execution, ownership, failure,
  timeout, cancellation, context and admission semantics. Use when a continuation runs on an
  I/O thread, a branch failure disappears, allOf or anyOf has the wrong policy, a timeout leaves
  work running, or asynchronous fan-out overloads a dependency. Distinguishes Java 17/21 APIs
  from Java 25 preview structured-concurrency alternatives.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/completablefuture-composition
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/completablefuture-composition

keywords:
  - java
  - concurrency
  - completablefuture
  - async
  - composition
  - forkjoinpool
  - error-handling

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: forkjoinpool-and-work-stealing
    version: ^1.0.0
  - name: cancellation-and-interruption
    version: ^1.0.0

suggests:
  - structured-concurrency

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: CompletableFuture Composition
      short_description: Stage graphs, executors, exceptions and context
      default_prompt: Use CompletableFuture Composition to check which thread runs this chain and where its failures go.
