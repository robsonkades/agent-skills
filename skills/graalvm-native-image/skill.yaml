schemaVersion: 1

name: graalvm-native-image
version: 2.0.0
description: >-
  GraalVM Native Image: closed-world reachability, dynamic-feature metadata,
  class initialization and image-heap state, CPU targeting, GC and PGO choices,
  observability, and fair comparison with HotSpot. Use when deciding whether AOT
  fits a workload, diagnosing build or runtime-only failures, or validating startup,
  footprint, latency, throughput, build-cost, portability, and security trade-offs.
  Does not cover Graal as a JVM JIT (graalvm-jit), JVM-preserving startup strategies
  (startup-cds-crac-leyden), or HotSpot warm-up mechanics (jit-compilation).

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/graalvm-native-image
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/graalvm-native-image

keywords:
  - java
  - graalvm
  - native-image
  - aot
  - startup
  - reflection
  - pgo

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: graalvm-jit
    version: ^2.0.0

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: GraalVM Native Image
      short_description: Closed-world AOT builds, metadata and measurement
      default_prompt: Use GraalVM Native Image to decide, build or measure an ahead-of-time native binary.
