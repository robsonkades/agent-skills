  url: https://github.com/robsonkades/agent-skills
  directory: skills/architecture-trade-off-analysis

keywords:
  - architecture
  - trade-offs
  - decision-analysis
  - mece
  - coupling
  - bias

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies: []

suggests:
