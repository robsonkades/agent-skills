schemaVersion: 1

name: delivery-semantics
version: 1.2.0
description: >-
  Precise end-to-end delivery and processing semantics: acknowledgement placement, loss and
  duplicate windows, Kafka transactions, visibility leases, ambiguous outcomes and external
  side effects. Use when reviewing "exactly once", consumer commits, redelivery or a handler
  that writes outside its broker. Idempotent handler design belongs to idempotency; retries,
  ordering, poison messages and fault assumptions have their own skills.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/delivery-semantics
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/delivery-semantics

keywords:
  - distributed-systems
  - messaging
  - kafka
  - at-least-once
  - exactly-once
  - acknowledgement
  - duplicates

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: failure-models
    version: ^1.0.0

suggests:
  - message-ordering-and-partitioning
  - poison-messages-and-dlq

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Delivery Semantics
      short_description: At-most-once, at-least-once, effectively-once
      default_prompt: Use Delivery Semantics to state the delivery guarantee this path actually provides.
