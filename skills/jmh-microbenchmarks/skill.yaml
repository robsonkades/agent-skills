  url: https://github.com/robsonkades/agent-skills
  directory: skills/jmh-microbenchmarks

keywords:
  - java
  - jmh
  - benchmark
  - microbenchmark
  - blackhole
  - measurement
  - ci-gate

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
