schemaVersion: 1

name: clean-delivery-workflow
version: 1.0.0
description: >-
  The order of work for a change, and how much of that order a given change actually warrants:
  understanding before editing, clarifying what is ambiguous, deciding the test approach,
  implementing in reversible steps, keeping refactoring in separate commits from behaviour,
  running the gates the risk deserves, and verifying before declaring done. Also the entry point
  that routes a situation to the skill that owns it. Use when starting a change and the order is
  not obvious, when a change has sprawled and needs re-sequencing, when refactoring and
  behaviour changes have been mixed in one commit, when work is being declared done without
  verification, when the same ceremony is being applied to a one-line fix and a migration, or
  when you know the problem but not which skill covers it. Does not itself cover any step in
  depth — it routes to requirements-and-acceptance, java-testing-strategy, tdd, java-refactoring,
  code-review and quality-gates, each of which owns its own.

