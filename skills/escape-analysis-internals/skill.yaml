schemaVersion: 1

name: escape-analysis-internals
version: 2.0.0
description: >-
  C2 escape-analysis internals: connection graphs, escape-state propagation, flow
  insensitivity, bytecode escape summaries, scalar replacement and allocation merges,
  lock elimination, macro expansion, and deoptimization rematerialization. Use when a hot
  object still allocates, an inlining boundary changes EA, a product-build diagnostic is
  misleading, a disabled JFR allocation event is treated as proof, or recurring deoptimization
  makes eliminated objects costly. Does not cover introductory design/measurement rules
  (jit-inlining-and-escape-analysis), general C2 phases (c2-sea-of-nodes), or Graal partial
  escape analysis (graalvm-jit).

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/escape-analysis-internals
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/escape-analysis-internals

keywords:
  - java
  - jvm
  - escape-analysis
  - scalar-replacement
  - connection-graph
  - allocation
  - c2

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: jit-inlining-and-escape-analysis
    version: ^2.0.0
  - name: c2-sea-of-nodes
    version: ^1.0.0

suggests:
  - compilation-and-inlining-logs
  - deoptimization
  - graalvm-jit

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Escape Analysis Internals
      short_description: Connection graph, escape states and scalar replacement
      default_prompt: Use Escape Analysis Internals to explain why this object was not eliminated.
