  url: https://github.com/robsonkades/agent-skills
  directory: skills/debugging

keywords:
  - debugging
  - root-cause
  - incident
  - bisect
  - thread-dump
  - reproduction

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies: []

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Debugging
      short_description: Reproduce, shrink, hypothesise, verify
      default_prompt: Use Debugging to find the cause of this fault.
