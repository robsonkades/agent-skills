schemaVersion: 1

name: load-testing
version: 1.4.0
description: >-
  Designing valid service load experiments: choosing open or closed workload models,
  defining offered, admitted and successful work, controlling generator and environment
  bias, representative workload and data, state-based warmup, run validity, uncertainty,
  and reproducible evidence. Use when designing or reviewing k6, Gatling, JMeter or similar
  tests, diagnosing a throughput plateau, validating a baseline, or deciding whether a run
  measured the target rather than the generator. Profile selection and breakpoint, burst,
  stress and soak procedures belong to load-testing-advanced; coordinated omission belongs
  to coordinated-omission; inference belongs to latency-statistics.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/load-testing
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/load-testing

keywords:
  - java
  - load-testing
  - k6
  - gatling
  - open-loop
  - capacity
  - soak

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: littles-law-and-queueing
    version: ^1.0.0
  - name: latency-statistics
    version: ^1.0.0
  - name: coordinated-omission
    version: ^1.0.0

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Load Testing
      short_description: Open-loop design and run validity
      default_prompt: Use Load Testing to design or review this load test.
