schemaVersion: 1

name: distributed-transactions-and-sagas
version: 1.3.0
description: >-
  Coordinating a business operation across transactional owners: dual writes, XA/2PC,
  persisted sagas, compensation, pivot/forward recovery, ambiguous outcomes and manual
  repair. Use when a local transaction is expected to cover a broker or remote service, or
  in-flight workflow state cannot survive restart. Outbox delivery, idempotency, consistency,
  retries and single-database transaction design remain in their owning skills.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/distributed-transactions-and-sagas
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/distributed-transactions-and-sagas

keywords:
  - saga
  - compensation
  - two-phase-commit
  - dual-write
  - distributed-transactions
  - orchestration
  - java

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: idempotency
    version: ^1.0.0
  - name: delivery-semantics
    version: ^1.0.0

suggests:
  - consistency-models
  - distributed-locks-and-leases
  - event-driven-architecture
  - failure-models
  - leader-election
  - retries-and-backoff

capabilities:
  - reads-source

agentOverrides:
