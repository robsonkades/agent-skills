schemaVersion: 1

name: unified-logging
version: 1.2.0
description: >-
  Constructing, validating and operating HotSpot unified JVM logging: exact versus
  wildcard tag-set selection, levels, outputs, decorators, file rotation, asynchronous
  drop/stall modes, runtime VM.log changes, environment-injected options and legacy-flag
  migration. Use when -Xlog is empty, excessive, missing after restart, rejected at
  startup, changed live with jcmd, mixed with container logs, or evaluated for overhead.
  Producing and preserving the intended evidence belongs here; interpretation belongs to
  GC, safepoint, JIT, class-loading and other owning skills.

