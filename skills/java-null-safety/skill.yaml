schemaVersion: 1

name: java-null-safety
version: 1.0.0
description: >-
  Null as a semantic problem: what each null means (absence, error, uninitialised),
  nullability as an API contract, JSpecify @NullMarked/@Nullable, where
  Objects.requireNonNull belongs, empty collections over null, and the boundaries
  where null leaks in (deserialisation, ORMs, Map.get, arrays). Use when NPEs surface
  far from their cause, when hardening a service boundary, or when adopting
  nullability annotations. The Optional API itself is java-optional; general
  validation strategy at trust boundaries is java-defensive-programming.

