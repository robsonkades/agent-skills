  directory: skills/service-layer-design

keywords:
  - service-layer
  - application-layer
  - use-case
  - application-service
  - ddd
  - reference-fidelity

files:
  - SKILL.md
  - skill.yaml
  - references/
  - assets/

dependencies: []

suggests:
  - java-ddd-use-cases

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Service Layer Design
      short_description: Reference-faithful application organization and boundaries
      default_prompt: Use Service Layer Design to organize or review this application layer against the ddd-example reference.
