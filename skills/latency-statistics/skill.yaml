  url: https://github.com/robsonkades/agent-skills
  directory: skills/latency-statistics

keywords:
  - java
  - performance
  - latency
  - percentiles
  - histogram
  - hdrhistogram
  - statistics

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies: []

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Latency Statistics
      short_description: Percentiles, histograms and sample adequacy
      default_prompt: Use Latency Statistics to check whether this latency number means what it claims.
