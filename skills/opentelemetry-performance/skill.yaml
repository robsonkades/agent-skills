schemaVersion: 1

name: opentelemetry-performance
version: 1.2.0
description: >-
  Designing OpenTelemetry tracing that remains causally useful within an explicit
  overhead and data-risk budget: auditing automatic/manual coverage, preserving context
  across asynchronous boundaries, choosing head/tail sampling and collector topology,
  controlling attributes/baggage, backpressure and export failure, and measuring
  application plus collector cost. Use when traces fragment, rare tails disappear,
  Collector memory grows, telemetry drops under incidents, instrumentation duplicates
  spans, or someone assumes a published agent-overhead figure applies locally. Trace
  schema design belongs to distributed-tracing-design; statistics to latency-statistics;
  profiling to continuous-profiling.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/opentelemetry-performance
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/opentelemetry-performance

keywords:
  - opentelemetry
  - tracing
  - sampling
  - context-propagation
  - baggage
  - observability
  - java

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: latency-statistics
    version: ^1.0.0

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: OpenTelemetry Performance
      short_description: Tracing cost, sampling and context propagation
      default_prompt: Use OpenTelemetry Performance to review this instrumentation and its cost.
