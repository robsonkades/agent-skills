schemaVersion: 1

name: java-fluent-apis
version: 1.0.0
description: >-
  Fluent interfaces and builders as API decisions: when a builder pays for itself
  versus a record, constructor or static factory; staged builders and their
  compatibility cost; immutable wither-style APIs; and the debugging and binary
  compatibility consequences of method chaining. Use when designing or reviewing
  a type with four or more constructor parameters, several optional ones, or a
  proposed builder, staged builder or DSL. Navigation chains are covered by
  java-law-of-demeter.

