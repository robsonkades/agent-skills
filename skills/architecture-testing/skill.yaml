schemaVersion: 1

name: architecture-testing
version: 1.3.3
description: >-
  Write or review tests for architectural promises: dependency boundaries, transaction
  atomicity, persistence mappings, stale-write detection, query budgets and API/event
  compatibility. Use when green tests missed a lost update or N+1, a boundary exists only
  in documentation, or an integration test may hide the behavior it claims to verify.
  Does not choose the architecture or governance thresholds (architecture-fitness-functions),
  replace general unit-test design, or establish production capacity (load-testing).

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/architecture-testing
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/architecture-testing

keywords:
  - testing
  - archunit
  - testcontainers
  - query-budget
  - concurrency-tests
  - contract-tests

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: layering-and-boundaries
    version: ^1.0.0
  - name: enterprise-transactions
    version: ^1.0.0
  - name: load-testing
    version: ^1.0.0
  - name: metadata-mapping
    version: ^1.0.0

suggests:
  - architecture-fitness-functions
  - architecture-and-performance
  - distribution-boundaries
  - enterprise-base-patterns
  - offline-concurrency-control
  - orm-behavioral-patterns
  - remote-facade-and-dto
  - rpc-and-api-contracts

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Architecture Testing
      short_description: Testing boundaries, budgets and concurrency
      default_prompt: Use Architecture Testing to verify what this architecture promises.
