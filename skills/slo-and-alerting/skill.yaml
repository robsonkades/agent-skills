schemaVersion: 1

name: slo-and-alerting
version: 1.4.0
description: >-
  Engineering service-level contracts and actionable alerting: defining user-centered
  SLIs and SLOs with explicit populations and windows, negotiating error-budget policy,
  separating request- and time-based semantics, deriving multi-window burn alerts,
  handling low traffic and missing data, and routing symptoms or predictive hazards by
  urgency and actionability. Use when an SLO is ambiguous, an SLA lacks operating margin,
  alert noise is high, resource thresholds page without context, or PromQL burn rules need
  review. Instrument design belongs to metrics-and-cardinality; percentile semantics to
  latency-statistics; overload controls to rate-limiting-and-load-shedding.

