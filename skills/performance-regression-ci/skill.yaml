schemaVersion: 1

name: performance-regression-ci
version: 1.1.0
description: >-
  Designing trustworthy performance-regression gates: defining the decision and smallest
  important regression, preserving independent experimental units, calibrating noise and
  power, comparing compatible JMH results, handling multiplicity and drift, separating
  screening from confirmation, and operating secure baseline promotion. Use when performance
  results should influence merge, when a threshold or statistical test lacks an empirical
  error budget, when JMH scoreError is treated as a two-build test, when repeated iterations
  are mistaken for independent runs, when CI infrastructure changes contaminate comparisons,
  or when a pipeline can lose a comparator exit status. Does not teach benchmark construction
  (jmh-advanced), full-system workload design (load-testing), or general latency inference
  (latency-statistics).

