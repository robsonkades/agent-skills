  url: https://github.com/robsonkades/agent-skills
  directory: skills/performance-regression-ci

keywords:
  - java
  - performance
  - regression
  - ci
  - jmh
  - benchmark
  - baseline

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
