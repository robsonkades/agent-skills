schemaVersion: 1

name: java-optional
version: 1.0.0
description: >-
  Optional as designed: a return type for "no result is a normal outcome". Covers
  orElse versus orElseGet (eager versus lazy), orElseThrow over get,
  map/flatMap/filter chains versus a plain conditional, or(), ifPresentOrElse,
  stream() integration, why not fields, parameters or collections, and when Optional
  makes an API worse. Use when reviewing Optional.get(), isPresent()+get() pairs,
  Optional fields or parameters, or costly orElse fallbacks. Nullability contracts
  are java-null-safety.

