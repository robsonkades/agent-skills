schemaVersion: 1

name: lock-free-patterns
version: 1.2.0
description: >-
  Designing and reviewing nonblocking Java algorithms: linearization points, lock-free,
  wait-free and obstruction-free progress, CAS/RMW loops, success/failure ordering, contention
  collapse, backoff/helping, ABA/version wrap, node reuse and reclamation, publication,
  linearizability, starvation and shutdown. Requires comparison with JDK/library and lock-based
  alternatives plus retry and topology measurement. Use when implementing or diagnosing atomics,
  striped counters, queues, stacks or ring buffers—not as a synonym for “fast.”

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/lock-free-patterns
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/lock-free-patterns

keywords:
  - java
  - concurrency
  - lock-free
  - cas
  - aba
  - longadder
  - disruptor

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: varhandles-and-memory-ordering
    version: ^1.0.0

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Lock-Free Patterns
      short_description: CAS loops, ABA, striping and when to use a lock
      default_prompt: Use Lock-Free Patterns to decide whether this should be lock-free and get the loop right.
