schemaVersion: 1

name: java-law-of-demeter
version: 1.0.0
description: >-
  Navigation coupling: what the Law of Demeter actually constrains — structure
  exposure, not dot-counting — train wrecks versus legitimate chains, and the
  wrapper-explosion failure mode of dogmatic application. Use when reviewing
  chains like order.getCustomer().getAddress().getCity(), when shape changes
  ripple through unrelated files, or when a fix proposes forwarding methods on
  every intermediate class. Fluent chain design is java-fluent-apis; decision
  placement is java-tell-dont-ask.

