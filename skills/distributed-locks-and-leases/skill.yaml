schemaVersion: 1

name: distributed-locks-and-leases
version: 1.3.0
description: >-
  Cross-process exclusion through leases, session/transaction locks and fencing: stale
  holders, owner-safe release, Redis/Redlock assumptions, database advisory locks, resource
  claims and lock-free alternatives. Use when reviewing SET NX/TTL, watchdog renewal,
  duplicate workers or a lock around a non-repeatable effect. Consensus implementation,
  leader election, local JVM locking and user-session concurrency are separate skills.

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/distributed-locks-and-leases
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/distributed-locks-and-leases

keywords:
  - distributed-systems
  - locking
  - lease
  - fencing
  - redis
  - redlock
  - concurrency

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: consensus-and-quorums
    version: ^1.0.0
  - name: failure-models
    version: ^1.0.0
  - name: sharding-and-partitioning
    version: ^1.0.0

suggests:
  - connection-pool-sizing
  - java-memory-model
  - leader-election
  - pause-attribution
  - timeouts-and-deadlines

capabilities:
  - reads-source

agentOverrides:
  codex:
    interface:
      display_name: Distributed Locks And Leases
      short_description: Leases, fencing tokens and lock alternatives
      default_prompt: Use Distributed Locks And Leases to check whether this lock actually excludes anything.
