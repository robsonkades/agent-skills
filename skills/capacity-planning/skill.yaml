schemaVersion: 1

name: capacity-planning
version: 1.2.0
description: >-
  Evidence-based capacity decisions for Java services: defining demand and failure
  scenarios, measuring feasible capacity envelopes, selecting replica and resource
  configurations, forecasting exhaustion with uncertainty, designing autoscaling
  headroom, and comparing cost per successful unit of work. Use when deciding pod or
  instance counts, minimum replicas, scaling signals, saturation dates, infrastructure
  budgets, rollout or failure-domain headroom, and downstream capacity constraints. Does
  not own load-test design (load-testing-advanced), queueing-model selection
  (queueing-models), scalability curve fitting (universal-scalability-law), or overload
  controls (rate-limiting-and-load-shedding).

license: Apache-2.0

authors:
  - name: agent-skills contributors
    url: https://github.com/robsonkades/agent-skills

homepage: https://github.com/robsonkades/agent-skills/tree/main/skills/capacity-planning
repository:
  type: git
  url: https://github.com/robsonkades/agent-skills
  directory: skills/capacity-planning

keywords:
  - capacity-planning
  - performance
  - scalability
  - autoscaling
  - slo
  - forecasting
  - cost

files:
  - SKILL.md
  - skill.yaml
  - references/

dependencies:
  - name: universal-scalability-law
    version: ^1.0.0
  - name: queueing-models
    version: ^1.0.0

suggests:
  - cascading-failures
  - connection-pool-sizing
  - container-awareness
  - jvm-gc-tuning
  - kubernetes-service-lifecycle
  - load-testing
  - rate-limiting-and-load-shedding
  - retries-and-backoff
  - slo-and-alerting
  - startup-cds-crac-leyden

capabilities:
  - reads-source

agentOverrides:
