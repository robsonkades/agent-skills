schemaVersion: 1

name: feature-engineering
version: 1.0.0
description: >-
  Owning a feature request from first reading to completion review: choosing how much of the
  lifecycle the change actually warrants, running the phases in order, holding the gates that stop
  implementation beginning on unresolved assumptions, and keeping a dossier that lets another
  agent resume the work. Use when a feature request arrives and the order of work is not obvious,
  when implementation is about to start on a request whose technology or scope was never agreed,
  when a half-finished feature has to be picked up from someone else, when the same feature is
  being re-analysed because nobody wrote down what was decided, or when a change is being declared
  done because it compiles. Does not own any phase in depth — it routes to the thirteen
  specialised feature-* skills — and it is not the general order of work for an arbitrary change
  (clean-delivery-workflow), nor the record format for a decision (architecture-decision-making).
